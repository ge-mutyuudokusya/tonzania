<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>いんせきを よけろ！</title>
<style>
*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden;background:#fff8e7;color:#13142e;font-family:"Arial Rounded MT Bold","Hiragino Maru Gothic ProN",system-ui,sans-serif}body{background-image:radial-gradient(#d8d0ff 1.4px,transparent 1.4px);background-size:26px 26px}.shell{width:min(1050px,100%);height:100%;margin:auto;padding:20px 26px;display:flex;flex-direction:column}.top{display:flex;align-items:end;justify-content:space-between;margin-bottom:14px}.tag{font:bold 10px system-ui;letter-spacing:.28em;color:#7557ff}.top h1{font-size:clamp(35px,6vh,64px);line-height:.82;letter-spacing:-.07em;margin:7px 0 0}.top h1 span{color:#7557ff;text-shadow:3px 3px #dcd5ff}.top p{text-align:right;font-weight:bold;line-height:1.7;margin:0}.card{min-height:0;flex:1;border:4px solid #13142e;border-radius:23px;box-shadow:8px 8px #13142e;background:white;overflow:hidden;display:flex;flex-direction:column}.hud{height:54px;flex:none;display:flex;align-items:center;justify-content:space-between;padding:0 22px;font-size:13px;font-weight:bold}.hud b{font-size:24px;color:#7557ff;margin-left:7px}.stage{position:relative;min-height:0;flex:1;border-top:4px solid #13142e}canvas{width:100%;height:100%;display:block;touch-action:none}.overlay{position:absolute;inset:0;background:#080a20cb;color:white;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;backdrop-filter:blur(3px)}.overlay.hide{display:none}.meteor{font-size:55px;color:#ffce57;filter:drop-shadow(0 0 14px #ff8b57);animation:pulse 1.4s infinite}.overlay h2{font-size:clamp(28px,5vw,47px);margin:6px}.overlay p{font-weight:bold;color:#e1e2ff;margin:0 0 22px}.overlay button{border:3px solid white;border-radius:99px;background:#ffe05d;color:#13142e;font:bold 17px inherit;padding:13px 24px;box-shadow:0 6px #7557ff;cursor:pointer}.overlay button:active{transform:translateY(4px);box-shadow:0 2px #7557ff}.help{height:48px;flex:none;display:flex;align-items:center;justify-content:space-between;font-size:12px;font-weight:bold;padding-top:10px}.keys{display:flex;align-items:center;gap:6px}kbd{background:white;border:2px solid #13142e;border-radius:6px;padding:5px 8px;box-shadow:0 3px #13142e}.touch{color:#7557ff}@keyframes pulse{50%{transform:scale(1.15) rotate(8deg)}}@media(max-width:600px){.shell{padding:12px}.top p{display:none}.top h1{font-size:42px}.card{box-shadow:5px 5px #13142e}.hud{padding:0 12px}.hud b{font-size:19px}.touch{display:none}}
</style>
</head>
<body>
<main class="shell">
 <header class="top"><div><div class="tag">SPACE DODGE</div><h1>いんせきを<br><span>よけろ！</span></h1></div><p>うちゅうせんを動かして、<br>できるだけ長く生きのこれ！</p></header>
 <section class="card"><div class="hud"><span>タイム <b id="score">00</b> 秒</span><span>ベスト <b id="best">00</b> 秒</span></div>
  <div class="stage"><canvas id="game"></canvas><div class="overlay" id="overlay"><div class="meteor">☄</div><h2 id="message">じゅんびは いい？</h2><p id="sub">飛んでくる隕石をよけつづけよう</p><button id="start">ゲームスタート　→</button></div></div>
 </section>
 <footer class="help"><div class="keys"><kbd>WASD</kbd><kbd>↑↓←→</kbd><span>で うごく</span></div><div class="touch">スマホは画面をタッチ</div></footer>
</main>
<script>
const c=document.querySelector("#game"),x=c.getContext("2d"),overlay=document.querySelector("#overlay"),scoreEl=document.querySelector("#score"),bestEl=document.querySelector("#best");
let mode="ready",ship={},rocks=[],sparks=[],frames=0,spawn=0,last=performance.now(),keys=new Set(),touch={on:false,x:0,y:0};
bestEl.textContent=String(+localStorage.getItem("meteor-best")||0).padStart(2,"0");
function resize(){let r=c.getBoundingClientRect(),d=Math.min(devicePixelRatio,2);c.width=r.width*d;c.height=r.height*d;x.setTransform(d,0,0,d,0,0)}addEventListener("resize",resize);resize();
function rock(){let w=c.clientWidth,h=c.clientHeight,e=Math.floor(Math.random()*4),px=e==1?w+40:e==3?-40:Math.random()*w,py=e==0?-40:e==2?h+40:Math.random()*h,a=Math.atan2(ship.y-py,ship.x-px)+(Math.random()-.5)*.35,s=2+frames/1800+Math.random()*1.4;rocks.push({x:px,y:py,vx:Math.cos(a)*s,vy:Math.sin(a)*s,r:14+Math.random()*18,spin:(Math.random()-.5)*.08,rot:0})}
function start(){ship={x:c.clientWidth/2,y:c.clientHeight/2,r:15};rocks=[];sparks=[];frames=spawn=0;mode="play";scoreEl.textContent="00";overlay.classList.add("hide")}
function over(){mode="over";for(let i=0;i<45;i++){let a=Math.random()*7,s=1+Math.random()*6;sparks.push({x:ship.x,y:ship.y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,l:1})}let n=Math.floor(frames/60),b=Math.max(n,+localStorage.getItem("meteor-best")||0);localStorage.setItem("meteor-best",b);bestEl.textContent=String(b).padStart(2,"0");document.querySelector("#message").textContent="しょうとつ！";document.querySelector("#sub").textContent=n+"びょう 生きのこった！";document.querySelector("#start").textContent="もういちど　→";overlay.classList.remove("hide")}
document.querySelector("#start").onclick=start;
addEventListener("keydown",e=>{keys.add(e.key.toLowerCase());if(["arrowup","arrowdown","arrowleft","arrowright"," "].includes(e.key.toLowerCase()))e.preventDefault();if((e.key==" "||e.key=="Enter")&&mode!="play")start()});addEventListener("keyup",e=>keys.delete(e.key.toLowerCase()));
function point(e){let r=c.getBoundingClientRect();touch.x=e.clientX-r.left;touch.y=e.clientY-r.top}c.onpointerdown=e=>{touch.on=true;point(e)};c.onpointermove=point;c.onpointerup=()=>touch.on=false;c.onpointercancel=()=>touch.on=false;
function drawRock(r){x.save();x.translate(r.x,r.y);x.rotate(r.rot);x.beginPath();for(let i=0;i<10;i++){let a=i*Math.PI/5,rr=r.r*(.78+i%3*.1);x.lineTo(Math.cos(a)*rr,Math.sin(a)*rr)}x.closePath();x.fillStyle="#9b674d";x.strokeStyle="#412e3b";x.lineWidth=4;x.fill();x.stroke();x.fillStyle="#70483e";x.beginPath();x.arc(-r.r*.25,-r.r*.15,r.r*.2,0,7);x.arc(r.r*.28,r.r*.25,r.r*.13,0,7);x.fill();x.restore()}
function loop(now){let dt=Math.min((now-last)/16.67,2),w=c.clientWidth,h=c.clientHeight;last=now;x.fillStyle="#080a20";x.fillRect(0,0,w,h);x.fillStyle="#ffffff88";for(let i=0;i<80;i++){let px=i*137.3%w,py=(i*83.7+now*.008*(i%3+1))%h;x.fillRect(px,py,i%5?1:2,i%5?1:2)}
if(mode=="play"){frames+=dt;scoreEl.textContent=String(Math.floor(frames/60)).padStart(2,"0");let dx=0,dy=0;if(keys.has("a")||keys.has("arrowleft"))dx--;if(keys.has("d")||keys.has("arrowright"))dx++;if(keys.has("w")||keys.has("arrowup"))dy--;if(keys.has("s")||keys.has("arrowdown"))dy++;if(touch.on){let a=Math.atan2(touch.y-ship.y,touch.x-ship.x);if(Math.hypot(touch.x-ship.x,touch.y-ship.y)>10){dx=Math.cos(a);dy=Math.sin(a)}}let m=Math.hypot(dx,dy)||1;ship.x=Math.max(20,Math.min(w-20,ship.x+dx/m*5.4*dt));ship.y=Math.max(20,Math.min(h-20,ship.y+dy/m*5.4*dt));spawn+=dt;if(spawn>Math.max(14,52-frames/190)){rock();spawn=0}let meteorSpeed=frames>1800?1.8:1;rocks.forEach(r=>{r.x+=r.vx*dt*meteorSpeed;r.y+=r.vy*dt*meteorSpeed;r.rot+=r.spin*dt*meteorSpeed});rocks=rocks.filter(r=>r.x>-100&&r.x<w+100&&r.y>-100&&r.y<h+100);if(rocks.some(r=>Math.hypot(ship.x-r.x,ship.y-r.y)<ship.r+r.r-5))over()}
rocks.forEach(drawRock);if(ship.x!=null){x.save();x.translate(ship.x,ship.y);x.fillStyle="#ff7849";x.beginPath();x.moveTo(-8,12);x.lineTo(0,28+Math.random()*8);x.lineTo(8,12);x.fill();x.fillStyle="#55e7ff";x.strokeStyle="white";x.lineWidth=3;x.beginPath();x.moveTo(0,-20);x.lineTo(15,14);x.lineTo(0,9);x.lineTo(-15,14);x.closePath();x.fill();x.stroke();x.fillStyle="#7557ff";x.beginPath();x.arc(0,-4,5,0,7);x.fill();x.restore()}sparks.forEach(p=>{p.x+=p.vx*dt;p.y+=p.vy*dt;p.l-=.025*dt;x.globalAlpha=Math.max(0,p.l);x.fillStyle="#ffdc57";x.fillRect(p.x,p.y,5,5)});sparks=sparks.filter(p=>p.l>0);x.globalAlpha=1;requestAnimationFrame(loop)}requestAnimationFrame(loop);
</script>
</body></html>
