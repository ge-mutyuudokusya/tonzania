<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ねことおにごっこ</title>
<style>
  body{
    margin:0;
    background:#17202a;
    color:white;
    font-family:Arial, sans-serif;
    text-align:center;
  }
  h1{margin:10px 0 4px}
  p{margin:4px 0 10px}
  canvas{
    background:#79c267;
    border:4px solid white;
    border-radius:12px;
    max-width:95vw;
  }
</style>
</head>
<body>
<h1>🐱 ねことおにごっこ 🏃</h1>
<p>矢印キー または WASD でにげよう！ 30びょうにげきればクリア！</p>
<canvas id="game" width="800" height="550"></canvas>

<script>
const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");

const player = {x:100,y:250,r:18,speed:5};
const cat = {x:650,y:250,r:24,speed:2.2};

let keys = {};
let startTime = Date.now();
let gameOver = false;
let win = false;

const obstacles = [
  {x:280,y:100,w:80,h:180},
  {x:470,y:320,w:110,h:70},
  {x:120,y:390,w:100,h:50}
];

document.addEventListener("keydown", e=>{
  keys[e.key.toLowerCase()] = true;
  if((gameOver || win) && e.key === "Enter") restart();
});
document.addEventListener("keyup", e=>{
  keys[e.key.toLowerCase()] = false;
});

function circleRectCollide(c, r){
  const nx = Math.max(r.x, Math.min(c.x, r.x+r.w));
  const ny = Math.max(r.y, Math.min(c.y, r.y+r.h));
  const dx = c.x-nx, dy = c.y-ny;
  return dx*dx+dy*dy < c.r*c.r;
}

function movePlayer(){
  let ox=player.x, oy=player.y;

  if(keys["arrowleft"] || keys["a"]) player.x-=player.speed;
  if(keys["arrowright"] || keys["d"]) player.x+=player.speed;
  if(keys["arrowup"] || keys["w"]) player.y-=player.speed;
  if(keys["arrowdown"] || keys["s"]) player.y+=player.speed;

  player.x=Math.max(player.r,Math.min(canvas.width-player.r,player.x));
  player.y=Math.max(player.r,Math.min(canvas.height-player.r,player.y));

  for(const o of obstacles){
    if(circleRectCollide(player,o)){
      player.x=ox;
      player.y=oy;
      break;
    }
  }
}

function moveCat(){
  let dx=player.x-cat.x;
  let dy=player.y-cat.y;
  let len=Math.hypot(dx,dy);

  if(len>0){
    let ox=cat.x, oy=cat.y;
    cat.x += dx/len * cat.speed;
    cat.y += dy/len * cat.speed;

    for(const o of obstacles){
      if(circleRectCollide(cat,o)){
        cat.x=ox;
        cat.y=oy;

        // しょうがいぶつにぶつかったら少し横に回りこむ
        cat.x += (-dy/len) * cat.speed * 2;
        cat.y += (dx/len) * cat.speed * 2;
      }
    }
  }
}

function checkGame(){
  const dist=Math.hypot(player.x-cat.x,player.y-cat.y);
  if(dist < player.r+cat.r){
    gameOver=true;
  }

  const elapsed=(Date.now()-startTime)/1000;
  if(elapsed>=30 && !gameOver){
    win=true;
  }
}

function restart(){
  player.x=100; player.y=250;
  cat.x=650; cat.y=250;
  startTime=Date.now();
  gameOver=false;
  win=false;
}

function drawPlayer(){
  ctx.beginPath();
  ctx.arc(player.x,player.y,player.r,0,Math.PI*2);
  ctx.fillStyle="#3498db";
  ctx.fill();
  ctx.font="22px Arial";
  ctx.textAlign="center";
  ctx.fillText("😃",player.x,player.y+8);
}

function drawCat(){
  ctx.beginPath();
  ctx.arc(cat.x,cat.y,cat.r,0,Math.PI*2);
  ctx.fillStyle="#f5b041";
  ctx.fill();
  ctx.font="30px Arial";
  ctx.textAlign="center";
  ctx.fillText("🐱",cat.x,cat.y+10);
}

function draw(){
  ctx.clearRect(0,0,canvas.width,canvas.height);

  // 地面
  ctx.fillStyle="#79c267";
  ctx.fillRect(0,0,canvas.width,canvas.height);

  // しょうがいぶつ
  for(const o of obstacles){
    ctx.fillStyle="#795548";
    ctx.fillRect(o.x,o.y,o.w,o.h);
    ctx.font="30px Arial";
    ctx.fillText("🌳",o.x+o.w/2,o.y+o.h/2+10);
  }

  drawPlayer();
  drawCat();

  const remain=Math.max(0,30-(Date.now()-startTime)/1000);
  ctx.fillStyle="white";
  ctx.font="24px Arial";
  ctx.textAlign="left";
  ctx.fillText("のこり: "+remain.toFixed(1)+"びょう",20,35);

  if(gameOver || win){
    ctx.fillStyle="rgba(0,0,0,0.65)";
    ctx.fillRect(0,0,canvas.width,canvas.height);
    ctx.textAlign="center";
    ctx.font="46px Arial";
    ctx.fillStyle="white";
    ctx.fillText(gameOver ? "🐱 つかまった！" : "🎉 にげきった！",400,240);
    ctx.font="25px Arial";
    ctx.fillText("Enterキーでもういちど",400,300);
  }
}

function loop(){
  if(!gameOver && !win){
    movePlayer();
    moveCat();
    checkGame();
  }
  draw();
  requestAnimationFrame(loop);
}

loop();
</script>
</body>
</html>
