<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ロケット・スマッシュ</title><style>
*{box-sizing:border-box}body{margin:0;background:#f4eddc;color:#10152b;font-family:Arial,sans-serif;background-image:radial-gradient(#d7cfbd 1px,transparent 1px);background-size:18px 18px}main{width:min(1000px,94vw);margin:auto;padding:24px 0 36px}header{display:flex;justify-content:space-between;align-items:end;margin-bottom:15px}h1{font-size:clamp(38px,7vw,72px);line-height:.78;margin:0;font-style:italic;letter-spacing:-.07em}h1 em{color:#ff6847;-webkit-text-stroke:2px #10152b}.stats{display:flex;gap:9px}.stat{min-width:110px;padding:9px 12px;background:#ffd84e;border:3px solid #10152b;box-shadow:5px 5px #10152b}.stat:first-child{background:#7ae3cc}.stat small{display:block;font-weight:900}.stat b{font-size:26px}.stage{position:relative;border:6px solid #10152b;box-shadow:10px 10px #ff6847;background:#10152b;overflow:hidden}canvas{display:block;width:100%;height:auto}.status{position:absolute;left:14px;top:14px;background:#10152be8;color:white;border:2px solid white;padding:8px 11px;font-weight:900;font-size:13px}.buttons{display:grid;grid-template-columns:repeat(3,1fr);gap:13px;margin-top:24px}button{border:3px solid #10152b;background:white;box-shadow:5px 5px #10152b;padding:11px;font-weight:900;font-size:15px;cursor:pointer}button:nth-child(2){background:#ff6847;color:white}button:active{transform:translate(4px,4px);box-shadow:1px 1px #10152b}kbd{display:inline-grid;place-items:center;width:38px;height:38px;border:3px solid currentColor;margin-right:9px}.hint{text-align:center;font-weight:bold;font-size:13px;margin-top:20px}@media(max-width:600px){header{align-items:start}.stats{flex-direction:column}.stat{min-width:84px;padding:5px 8px}.stat b{font-size:19px}h1{font-size:40px}.buttons{gap:7px}.buttons button{font-size:11px;padding:7px 2px}kbd{display:block;margin:0 auto 5px}.status{font-size:10px;left:7px;top:7px}}
</style></head><body><main><header><h1>ROCKET<br><em>SMASH!</em></h1><div class="stats"><div class="stat"><small>スコア</small><b id="score">00000</b></div><div class="stat"><small>ロケット</small><b id="ammo">12</b></div></div></header><div class="stage"><canvas id="game" width="800" height="500"></canvas><div class="status" id="status">Aをおして ランチャーをもとう</div></div><div class="buttons"><button id="arm"><kbd>A</kbd>ランチャーをもつ</button><button id="fire"><kbd>D</kbd>はっしゃ！</button><button id="add"><kbd>T</kbd>たてものをふやす</button></div><p class="hint">↑ ↓ で ねらいをかえられるよ　・　1人でハイスコアをめざそう！</p></main><script>
const c=document.querySelector('#game'),x=c.getContext('2d'),scoreEl=document.querySelector('#score'),ammoEl=document.querySelector('#ammo'),statusEl=document.querySelector('#status'),colors=['#ff735c','#f6c84f','#63c7b2','#8e7dff','#4ca7e8'];let buildings=[],rockets=[],bits=[],aim=-.55,armed=false,score=0,ammo=12,shake=0;
function sync(){scoreEl.textContent=String(score).padStart(5,'0');ammoEl.textContent=ammo;statusEl.textContent=armed?'● ランチャー じゅんびOK':'Aをおして ランチャーをもとう'}function add(){let floors=3+Math.floor(Math.random()*5);buildings.push({x:430+Math.random()*260,w:58+Math.random()*36,color:colors[Math.floor(Math.random()*colors.length)],hp:Array(floors).fill(1)})}function arm(){armed=true;sync()}function fire(){if(!armed||ammo<1)return;rockets.push({x:112,y:410,vx:Math.cos(aim)*8.2,vy:Math.sin(aim)*8.2});ammo--;sync()}
document.querySelector('#arm').onclick=arm;document.querySelector('#fire').onclick=fire;document.querySelector('#add').onclick=add;add();add();add();add();addEventListener('keydown',e=>{let k=e.key.toLowerCase();if(['a','d','t','arrowup','arrowdown'].includes(k))e.preventDefault();if(k==='a')arm();if(k==='d')fire();if(k==='t')add();if(k==='arrowup')aim=Math.max(-1.25,aim-.08);if(k==='arrowdown')aim=Math.min(-.08,aim+.08)});
function loop(){x.save();x.clearRect(0,0,800,500);if(shake>0){x.translate((Math.random()-.5)*shake,(Math.random()-.5)*shake);shake*=.86}let sky=x.createLinearGradient(0,0,0,500);sky.addColorStop(0,'#17254a');sky.addColorStop(1,'#5a3b72');x.fillStyle=sky;x.fillRect(0,0,800,500);x.fillStyle='#ffd85c';x.beginPath();x.arc(680,70,34,0,7);x.fill();x.fillStyle='#ffffff2d';for(let i=0;i<25;i++)x.fillRect(i*83%790,i*47%260,2,2);x.fillStyle='#15182b';x.fillRect(0,445,800,55);x.fillStyle='#27304c';x.fillRect(0,445,800,9);buildings.forEach(b=>b.hp.forEach((hp,f)=>{if(!hp)return;let y=445-(f+1)*48;x.fillStyle=b.color;x.fillRect(b.x,y,b.w,46);x.fillStyle='#ffffff99';for(let wx=b.x+10;wx<b.x+b.w-8;wx+=22)x.fillRect(wx,y+11,10,13);x.strokeStyle='#14142866';x.strokeRect(b.x,y,b.w,46)}));x.save();x.translate(92,412);x.rotate(aim);x.fillStyle=armed?'#91ff69':'#58627f';x.fillRect(0,-9,72,18);x.fillStyle='#252a40';x.fillRect(52,7,13,28);x.fillStyle='#ffcf4b';x.fillRect(8,-13,13,26);x.restore();x.fillStyle='#e9edf8';x.beginPath();x.arc(72,406,22,0,7);x.fill();x.fillStyle='#262b43';x.fillRect(48,426,48,19);
rockets.forEach((r,i)=>{r.vy+=.035;r.x+=r.vx;r.y+=r.vy;x.fillStyle='#f8f3df';x.beginPath();x.arc(r.x,r.y,6,0,7);x.fill();x.fillStyle='#ff7b3f';x.beginPath();x.arc(r.x-r.vx*1.5,r.y-r.vy*1.5,5,0,7);x.fill();let hit=false;buildings.forEach(b=>b.hp.forEach((hp,f)=>{let y=445-(f+1)*48;if(hp&&r.x>b.x&&r.x<b.x+b.w&&r.y>y&&r.y<y+46){b.hp[f]=0;hit=true;score+=100;shake=12;sync();for(let q=0;q<28;q++)bits.push({x:r.x,y:r.y,vx:(Math.random()-.5)*8,vy:(Math.random()-.8)*8,life:1,color:q%2?b.color:'#ffd34d',size:3+Math.random()*6})}}));if(hit||r.x>820||r.y>500)rockets.splice(i,1)});bits.forEach((p,i)=>{p.vy+=.18;p.x+=p.vx;p.y+=p.vy;p.life-=.025;x.globalAlpha=Math.max(0,p.life);x.fillStyle=p.color;x.fillRect(p.x,p.y,p.size,p.size);x.globalAlpha=1;if(p.life<=0)bits.splice(i,1)});x.restore();requestAnimationFrame(loop)}sync();loop();
</script></body></html>
