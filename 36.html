<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ねこ迷路タイムアタック</title><style>
*{box-sizing:border-box}body{margin:0;background:#fff8e9;color:#173552;font-family:"Yu Gothic",Meiryo,sans-serif;text-align:center}header{display:flex;justify-content:space-between;align-items:center;max-width:920px;margin:auto;padding:18px}.brand{font-size:22px;font-weight:900}button{font:inherit;cursor:pointer;border:2px solid #173552;background:#fff;border-radius:12px;font-weight:900;box-shadow:3px 3px #173552;padding:9px 14px}.wrap{max-width:900px;margin:auto;padding:18px}h1{font-size:clamp(34px,7vw,62px);margin:8px;color:#ee6b52}.lead{font-weight:700}.card{background:#fff;border:2px solid #173552;border-radius:22px;padding:18px;box-shadow:9px 9px #173552;margin-top:24px}.stats{display:flex;justify-content:space-between;text-align:left;margin:0 5px 12px;font-variant-numeric:tabular-nums}.stats span{display:block;font-size:11px;color:#6b8395;font-weight:900}.stats b{font-size:20px}.mazeBox{position:relative;background:#f6c84f;padding:12px;border:2px solid #173552;border-radius:12px}.maze{display:grid;aspect-ratio:15/11;background:#fffaf0;border:3px solid #173552}.cell{position:relative;display:grid;place-items:center;border-style:solid;border-color:#173552;margin:-1.5px}.cat,.fish{position:absolute;font-size:clamp(16px,4vw,28px);z-index:2}.cat{animation:bob .3s}@keyframes bob{50%{transform:translateY(-5px)}}.done{position:absolute;inset:12%;display:none;place-items:center;background:#fffdf7f5;border:3px solid #173552;border-radius:20px;box-shadow:7px 7px #173552;z-index:5}.done.show{display:grid}.done h2{font-size:36px;color:#ee6b52;margin:6px}.pad{display:none;grid-template-columns:repeat(3,46px);gap:5px;justify-content:center;margin-top:18px}.pad button{padding:8px}.pad button:first-child{grid-column:2}.pad button:nth-child(2){grid-column:1}.hint{font-weight:800;margin:18px 0 3px}.small{font-size:11px;color:#6b8395}@media(max-width:600px){.wrap{padding:10px}.card{padding:11px}.pad{display:grid}.hint{display:none}.stats b{font-size:16px}}
</style></head><body><header><div class="brand">🐾 ねこ迷路</div><button id="reset">↻ 新しい迷路</button></header><main class="wrap"><h1>猫を魚まで<br>連れていこう！</h1><p class="lead">矢印キーで猫を動かして、最速タイムに挑戦！</p><section class="card"><div class="stats"><div><span>今回のタイム</span><b id="time">⏱ 0.00秒</b></div><div><span>ベストタイム</span><b id="best">🏆 --.--秒</b></div></div><div class="mazeBox"><div id="maze" class="maze"></div><div id="done" class="done"><div><div style="font-size:48px">🐱</div><h2>ゴール！</h2><p>タイムは <b id="final"></b></p><button id="again">もう一度あそぶ</button></div></div></div><p class="hint">矢印キーで猫を動かそう！</p><p class="small">壁にはぶつかれないよ</p><div class="pad"><button data-d="top">↑</button><button data-d="left">←</button><button data-d="bottom">↓</button><button data-d="right">→</button></div></section></main><script>
const R=11,C=15,M=document.querySelector('#maze');let maze,cat,start=null,elapsed=0,finished=false,timer,best=Number(localStorage.getItem('nekoMazeBest'))||null;const fmt=n=>(n/1000).toFixed(2)+'秒';function build(){maze=Array.from({length:R},()=>Array.from({length:C},()=>({top:1,right:1,bottom:1,left:1})));let seen=Array.from({length:R},()=>Array(C).fill(0)),stack=[[0,0]];seen[0][0]=1;while(stack.length){let [r,c]=stack.at(-1),o=[[r-1,c,'top','bottom'],[r,c+1,'right','left'],[r+1,c,'bottom','top'],[r,c-1,'left','right']].filter(x=>x[0]>=0&&x[0]<R&&x[1]>=0&&x[1]<C&&!seen[x[0]][x[1]]);if(!o.length){stack.pop();continue}let n=o[Math.random()*o.length|0];maze[r][c][n[2]]=0;maze[n[0]][n[1]][n[3]]=0;seen[n[0]][n[1]]=1;stack.push([n[0],n[1]])}}function render(){M.innerHTML='';M.style.gridTemplateColumns=`repeat(${C},1fr)`;maze.flat().forEach((x,i)=>{let e=document.createElement('div'),r=i/C|0,c=i%C;e.className='cell';e.style.cssText=`border-width:${x.top?3:0}px ${x.right?3:0}px ${x.bottom?3:0}px ${x.left?3:0}px`;if(r==R-1&&c==C-1)e.innerHTML='<span class="fish">🐟</span>';if(r==cat[0]&&c==cat[1])e.innerHTML+='<span class="cat">🐱</span>';M.append(e)})}function reset(){clearInterval(timer);build();cat=[0,0];start=null;elapsed=0;finished=false;document.querySelector('#time').textContent='⏱ 0.00秒';document.querySelector('#done').classList.remove('show');document.querySelector('#best').textContent='🏆 '+(best?fmt(best):'--.--秒');render()}function move(d){if(finished||maze[cat[0]][cat[1]][d])return;if(start===null){start=performance.now();timer=setInterval(()=>{elapsed=performance.now()-start;document.querySelector('#time').textContent='⏱ '+fmt(elapsed)},30)}let v={top:[-1,0],right:[0,1],bottom:[1,0],left:[0,-1]}[d];cat=[cat[0]+v[0],cat[1]+v[1]];render();if(cat[0]==R-1&&cat[1]==C-1){finished=true;clearInterval(timer);elapsed=performance.now()-start;document.querySelector('#time').textContent='⏱ '+fmt(elapsed);document.querySelector('#final').textContent=fmt(elapsed);document.querySelector('#done').classList.add('show');if(!best||elapsed<best){best=elapsed;localStorage.setItem('nekoMazeBest',best);document.querySelector('#best').textContent='🏆 '+fmt(best)}}}document.addEventListener('keydown',e=>{let d={ArrowUp:'top',ArrowRight:'right',ArrowDown:'bottom',ArrowLeft:'left'}[e.key];if(d){e.preventDefault();move(d)}});document.querySelectorAll('[data-d]').forEach(b=>b.onclick=()=>move(b.dataset.d));document.querySelector('#reset').onclick=reset;document.querySelector('#again').onclick=reset;reset();
</script></body></html>
