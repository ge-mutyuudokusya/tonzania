<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>にんじんゲット！</title><style>
*{box-sizing:border-box}body{margin:0;background:#052e16;color:#fff;font-family:system-ui,sans-serif;text-align:center}main{max-width:820px;margin:auto;padding:20px}h1{margin:5px;font-size:clamp(28px,6vw,48px);color:#fef08a}p{color:#dcfce7;font-weight:bold}#wrap{position:relative;border:7px solid #14532d;border-radius:24px;overflow:hidden;box-shadow:0 20px 50px #0008}canvas{display:block;width:100%;height:auto}.over{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;background:#052e16cc}.over.hide{display:none}.big{font-size:64px}.over h2{font-size:clamp(30px,6vw,54px);margin:8px}.over button{border:0;border-bottom:6px solid #c2410c;border-radius:16px;background:#fb923c;color:#431407;padding:14px 30px;font-size:21px;font-weight:900;cursor:pointer}.pad{display:none;margin-top:14px}.pad button{width:62px;height:54px;margin:3px;border:2px solid #ffffff55;border-radius:13px;background:#166534;color:white;font-size:24px;touch-action:none}@media(max-width:700px){.pad{display:block}}
</style></head><body><main><h1>🥕 にんじんゲット！</h1><p>ウサギから にげながら、にんじんを とろう！</p><div id="wrap"><canvas id="game" width="720" height="720"></canvas><div id="over" class="over"><div class="big">🥕 🏃 🐇</div><h2 id="message">じゅんびは いい？</h2><p id="help">やじるしキーか WASDで うごくよ</p><button id="start">ゲームスタート</button></div></div><div class="pad"><button data-k="arrowup">▲</button><div><button data-k="arrowleft">◀</button><button data-k="arrowdown">▼</button><button data-k="arrowright">▶</button></div></div><p>じかんは 45びょう。にんじんを とるほど ウサギが はやくなるよ！</p></main><script>
const C=document.querySelector('#game'),X=C.getContext('2d'),K={},O=document.querySelector('#over'),M=document.querySelector('#message'),H=document.querySelector('#help'),B=document.querySelector('#start');let S;
const rnd=()=>({x:70+Math.random()*580,y:90+Math.random()*560});function reset(){S={p:{x:360,y:570},r:{x:100,y:110},c:rnd(),score:0,time:45,run:true,last:performance.now()};O.classList.add('hide')}B.onclick=reset;
addEventListener('keydown',e=>{K[e.key.toLowerCase()]=1;if(e.key.startsWith('Arrow'))e.preventDefault()});addEventListener('keyup',e=>K[e.key.toLowerCase()]=0);document.querySelectorAll('[data-k]').forEach(b=>{let k=b.dataset.k;b.onpointerdown=()=>K[k]=1;b.onpointerup=b.onpointerleave=()=>K[k]=0});
S={p:{x:360,y:570},r:{x:100,y:110},c:{x:540,y:180},score:0,time:45,run:false,last:performance.now()};function loop(n){let d=Math.min((n-S.last)/1000,.04);S.last=n;if(S.run){let x=(K.arrowright||K.d?1:0)-(K.arrowleft||K.a?1:0),y=(K.arrowdown||K.s?1:0)-(K.arrowup||K.w?1:0);if(x&&y){x*=.707;y*=.707}S.p.x=Math.max(30,Math.min(690,S.p.x+x*260*d));S.p.y=Math.max(75,Math.min(690,S.p.y+y*260*d));let a=Math.atan2(S.p.y-S.r.y,S.p.x-S.r.x),v=85+S.score*5;S.r.x+=Math.cos(a)*v*d;S.r.y+=Math.sin(a)*v*d;let q=(a,b)=>Math.hypot(a.x-b.x,a.y-b.y);if(q(S.p,S.c)<45){S.score++;S.c=rnd()}S.time-=d;if(q(S.p,S.r)<48||S.time<=0){S.run=false;M.textContent='ゲーム おわり！';H.innerHTML='にんじん <b style="font-size:35px;color:#fde047">'+S.score+'</b> ほん';B.textContent='もういちど';O.classList.remove('hide')}}
let g=X.createLinearGradient(0,0,0,720);g.addColorStop(0,'#65a30d');g.addColorStop(1,'#166534');X.fillStyle=g;X.fillRect(0,0,720,720);X.fillStyle='#bef26455';for(let i=0;i<70;i++){let x=i*97%720,y=65+i*151%650;X.fillRect(x,y,3,12)}X.font='74px serif';X.textAlign='center';[[55,135],[665,135],[52,360],[668,390],[95,680],[625,680]].forEach(([x,y])=>X.fillText('🌳',x,y));X.fillStyle='#0f3f1fcc';X.fillRect(0,0,720,62);X.fillStyle='white';X.font='bold 25px system-ui';X.textAlign='left';X.fillText('🥕 '+S.score,25,40);X.textAlign='right';X.fillText('⏱ '+Math.max(0,Math.ceil(S.time)),695,40);X.font='52px serif';X.textAlign='center';X.fillText('🥕',S.c.x,S.c.y+18);X.font='54px serif';X.fillText('🏃',S.p.x,S.p.y+18);X.fillText('🐇',S.r.x,S.r.y+18);requestAnimationFrame(loop)}requestAnimationFrame(loop);
</script></body></html>
