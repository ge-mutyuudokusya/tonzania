<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>スカイライン・アスレチック</title>
<style>
:root{--ink:#07152e;--mint:#63f5d1;--yellow:#ffcb48;--paper:#f3f8f4}*{box-sizing:border-box}html{background:#061126}body{margin:0;color:var(--paper);font-family:Arial,"Hiragino Kaku Gothic ProN",sans-serif;background:radial-gradient(circle at 70% -10%,#205b78,transparent 45%),#061126;min-height:100vh}.shell{width:min(1180px,100%);margin:auto;padding:28px}header{display:flex;justify-content:space-between;align-items:end;margin-bottom:18px}.eye{margin:0 0 5px;color:var(--mint);font-size:11px;font-weight:800;letter-spacing:.24em}h1{font-size:clamp(30px,5vw,60px);line-height:.9;margin:0;letter-spacing:-.065em;font-weight:950}h1 span{color:var(--yellow)}button{font:inherit}.restart{border:1px solid #ffffff33;background:#ffffff0b;color:white;border-radius:999px;padding:11px 17px;font-size:12px;font-weight:800;cursor:pointer}.hud{display:grid;grid-template-columns:repeat(3,minmax(85px,130px)) 1fr;align-items:center;gap:9px;margin-bottom:10px}.hud>div{border-left:2px solid #ffffff2b;padding-left:12px}.hud small{display:block;color:#8ea7bc;font-size:9px;font-weight:800;letter-spacing:.18em}.hud strong{font-size:22px;font-variant-numeric:tabular-nums}.hud em{font-size:11px;font-style:normal;margin-left:2px;color:#8ea7bc}.status{justify-self:end;margin:0;padding:7px 14px;border-radius:5px;background:var(--yellow);color:var(--ink);font-size:11px;font-weight:950;letter-spacing:.15em}.wrap{position:relative;border:1px solid #ffffff24;border-radius:20px;overflow:hidden;box-shadow:0 28px 80px #0009;background:#10233e}canvas{display:block;width:100%;height:auto;aspect-ratio:16/9;touch-action:none}.win{position:absolute;inset:0;display:none;place-content:center;text-align:center;background:#061126c7;backdrop-filter:blur(5px)}.win.show{display:grid}.win p{color:var(--mint);font-size:13px;font-weight:900;letter-spacing:.25em;margin:0}.win h2{font-size:64px;margin:5px 0 18px}.win button{border:0;border-radius:99px;background:var(--yellow);color:var(--ink);padding:13px 24px;font-weight:900}.controls{display:none;grid-template-columns:64px 64px 1fr;gap:10px;margin-top:12px}.controls button{height:58px;border:1px solid #ffffff32;background:#ffffff12;color:white;border-radius:14px;font-size:22px;font-weight:900;touch-action:none}.controls .jump{background:var(--yellow);color:var(--ink);font-size:13px}footer{display:flex;gap:22px;margin-top:14px;color:#8ea7bc;font-size:10px;letter-spacing:.08em}footer p{margin:0}footer b{color:white}@media(max-width:700px){.shell{padding:18px 12px}.controls{display:grid}footer{display:none}.wrap{border-radius:12px}h1{font-size:34px}}
</style></head>
<body><main class="shell"><header><div><p class="eye">OBSTACLE RUN / 01</p><h1>SKYLINE <span>ATHLETIC</span></h1></div><button class="restart" id="restart">↻ リスタート</button></header>
<section class="hud"><div><small>TIME</small><strong id="time">0.00<em>s</em></strong></div><div><small>BEST</small><strong id="best">—</strong></div><div><small>FALLS</small><strong id="falls">0</strong></div><p class="status" id="status">READY</p></section>
<div class="wrap"><canvas id="game" width="960" height="540" aria-label="空中アスレチックゲーム"></canvas><div class="win" id="win"><p>COURSE CLEAR</p><h2 id="clearTime"></h2><button id="again">もう一度走る</button></div></div>
<div class="controls"><button data-key="left">←</button><button data-key="right">→</button><button class="jump" data-key="jump">JUMP</button></div>
<footer><p><b>MOVE</b> ← → / A D</p><p><b>JUMP</b> SPACE / W</p><p><b>RESET</b> R</p></footer></main>
<script>
const c=document.querySelector('#game'),x=c.getContext('2d'),W=960,H=540,keys={},touch={left:0,right:0,jump:0};
const ps=[{x:0,y:470,w:230,h:70},{x:300,y:430,w:115,h:24},{x:485,y:375,w:110,h:24},{x:665,y:320,w:105,h:24},{x:825,y:260,w:135,h:24},{x:680,y:175,w:100,h:22},{x:495,y:130,w:115,h:22},{x:300,y:185,w:110,h:22},{x:120,y:130,w:110,h:22},{x:0,y:70,w:110,h:22}],sp=[{x:335,y:410,w:36},{x:520,y:355,w:34},{x:712,y:300,w:32}],p={x:70,y:420,vx:0,vy:0,w:28,h:42,g:0};let state='ready',start=0,t=0,best=null,falls=0,frame=0,cp={x:70,y:420};
const $=s=>document.querySelector(s);function ui(){$('#time').innerHTML=t.toFixed(2)+'<em>s</em>';$('#best').innerHTML=best==null?'—':best.toFixed(2)+'<em>s</em>';$('#falls').textContent=falls;$('#status').textContent=state==='ready'?'READY':state==='playing'?'RUN!':'GOAL!';$('#status').style.background=state==='playing'?'var(--mint)':state==='won'?'#ff5577':'var(--yellow)'}
function reset(full=true){p.x=full?70:cp.x;p.y=full?420:cp.y;p.vx=p.vy=0;if(full){state='ready';t=0;cp={x:70,y:420};$('#win').classList.remove('show')}ui()}function die(){falls++;reset(false)}function rr(a,b,w,h,r){x.beginPath();x.roundRect(a,b,w,h,r)}
function update(){let l=keys.ArrowLeft||keys.KeyA||touch.left,r=keys.ArrowRight||keys.KeyD||touch.right,j=keys.Space||keys.ArrowUp||keys.KeyW||touch.jump;if((l||r||j)&&state==='ready'){state='playing';start=performance.now()}if(state!=='playing')return;t=(performance.now()-start)/1000;let a=p.g?.85:.46;if(l)p.vx-=a;if(r)p.vx+=a;p.vx*=p.g?.78:.96;p.vx=Math.max(-7,Math.min(7,p.vx));if(j&&p.g){p.vy=-12.6;p.g=0;touch.jump=0}let old=p.y+p.h;p.vy=Math.min(15,p.vy+.58);p.x+=p.vx;p.y+=p.vy;p.g=0;p.x=Math.max(0,Math.min(W-p.w,p.x));let m={x:150+Math.sin(frame*.025)*72,y:275,w:100,h:20};for(let q of [...ps,m])if(p.vy>=0&&old<=q.y+5&&p.y+p.h>=q.y&&p.x+p.w>q.x&&p.x<q.x+q.w){p.y=q.y-p.h;p.vy=0;p.g=1}for(let s of sp)if(p.x+p.w>s.x&&p.x<s.x+s.w&&p.y+p.h>s.y&&p.y<s.y+22)die();if(p.y>H+60)die();if(p.x>470&&p.y<150)cp={x:535,y:82};if(p.x<105&&p.y<70){state='won';best=best==null||t<best?t:best;$('#clearTime').textContent=t.toFixed(2)+'s';$('#win').classList.add('show')}ui()}
function draw(){let g=x.createLinearGradient(0,0,0,H);g.addColorStop(0,'#07152e');g.addColorStop(.55,'#173f62');g.addColorStop(1,'#ff8a56');x.fillStyle=g;x.fillRect(0,0,W,H);x.globalAlpha=.35;x.fillStyle='#c9fbff';for(let i=0;i<26;i++)x.fillRect((i*173+frame*.12*(i%3+1))%1000,(i*71)%330,2+i%2,2+i%2);x.globalAlpha=1;x.fillStyle='#10233e';x.beginPath();x.moveTo(0,440);for(let z=0;z<=W;z+=40)x.lineTo(z,390+Math.sin(z*.021)*55);x.lineTo(W,H);x.lineTo(0,H);x.fill();let m={x:150+Math.sin(frame*.025)*72,y:275,w:100,h:20};for(let q of ps){x.shadowColor='#63f5d1';x.shadowBlur=12;x.fillStyle='#102c49';rr(q.x,q.y,q.w,q.h,8);x.fill();x.shadowBlur=0;x.fillStyle='#63f5d1';x.fillRect(q.x+6,q.y,q.w-12,4)}x.fillStyle='#ffcb48';rr(m.x,m.y,m.w,m.h,8);x.fill();for(let s of sp){x.fillStyle='#ff5577';for(let z=s.x;z<s.x+s.w;z+=12){x.beginPath();x.moveTo(z,s.y+20);x.lineTo(z+6,s.y);x.lineTo(z+12,s.y+20);x.fill()}}x.fillStyle='#effffd';x.fillRect(46,20,5,50);x.fillStyle='#ffcb48';x.beginPath();x.moveTo(51,22);x.lineTo(88,34);x.lineTo(51,46);x.fill();x.shadowColor='#63f5d1';x.shadowBlur=20;x.fillStyle='#63f5d1';rr(p.x,p.y,p.w,p.h,9);x.fill();x.shadowBlur=0;x.fillStyle='#07152e';x.fillRect(p.x+17,p.y+10,5,5);x.fillStyle='#ffcb48';x.fillRect(p.x+5,p.y+31,18,5);if(state==='ready'){x.fillStyle='#040c1db8';rr(286,200,388,126,20);x.fill();x.textAlign='center';x.fillStyle='white';x.font='800 28px Arial';x.fillText('空のコースへ',480,244);x.font='600 16px Arial';x.fillStyle='#aefaea';x.fillText('← → で移動　SPACE でジャンプ',480,282)}frame++}
function loop(){update();draw();requestAnimationFrame(loop)}addEventListener('keydown',e=>{if(['ArrowLeft','ArrowRight','ArrowUp','Space'].includes(e.code))e.preventDefault();keys[e.code]=1;if(e.code==='KeyR')reset()});addEventListener('keyup',e=>keys[e.code]=0);document.querySelectorAll('[data-key]').forEach(b=>{let k=b.dataset.key;b.onpointerdown=()=>touch[k]=1;b.onpointerup=b.onpointerleave=()=>touch[k]=0});$('#restart').onclick=$('#again').onclick=()=>reset();ui();loop();
</script></body></html>
