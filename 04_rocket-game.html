<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ロケットビルディング・クラッシャー</title>
<style>*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at 75% 15%,#1d4976 0,transparent 28%),linear-gradient(135deg,#071531,#0b2448 60%,#112e4e);color:#fff7df;font-family:Arial,"Yu Gothic",sans-serif}main{width:min(1180px,94vw);margin:auto;padding:28px 0}.top{display:flex;align-items:end;justify-content:space-between;gap:20px;margin-bottom:16px}small{color:#67e8f9;font-weight:900;letter-spacing:.25em}h1{margin:5px 0 0;font-size:clamp(30px,5vw,62px);line-height:.9;letter-spacing:-.06em;text-shadow:0 5px #041027}h1 span{color:#ff5b19}.score{min-width:165px;padding:12px 18px;background:#fff7df;color:#071531;border:4px solid #071531;box-shadow:7px 7px #ff5b19;text-align:right;font-weight:900}.score b{display:block;color:#ff5b19;font-size:32px}.game{border:4px solid #fff7df;border-radius:22px;padding:10px;background:#061225;box-shadow:0 18px 60px #0008,8px 8px #ff5b19}.screen{position:relative;overflow:hidden;border-radius:12px}canvas{width:100%;height:auto;display:block}.status{position:absolute;top:14px;left:14px;padding:9px 15px;border:2px solid #ffffff88;border-radius:99px;background:#071531d8;font-weight:900}.buttons{display:grid;grid-template-columns:1fr 1.15fr 1fr auto;gap:10px;margin-top:10px}button{min-height:72px;border:0;border-radius:12px;background:#dbeafe;color:#071531;font:900 16px inherit;cursor:pointer;box-shadow:inset 0 -5px #07153133}button:hover{filter:brightness(1.1);transform:translateY(-2px)}button:active{transform:translateY(3px);box-shadow:none}.fire{background:#ff5b19;color:white}.reset{background:#334155;color:white;padding:0 18px}kbd{display:inline-grid;place-items:center;width:42px;height:42px;margin-right:9px;border:2px solid white;border-radius:8px;background:#071531;color:white;font-size:23px;box-shadow:0 4px #000}.tip{text-align:center;color:#bae6fd;font-weight:800}@media(max-width:700px){.buttons{grid-template-columns:1fr 1fr}.reset{grid-column:span 2}.score{min-width:125px}.status{font-size:11px}h1{line-height:1}}</style></head>
<body><main><div class="top"><div><small>CITY SMASH ARCADE</small><h1>ロケットビルディング<br><span>クラッシャー</span></h1></div><div class="score">スコア<b id="score">0</b><span id="count">ビル 3こ</span></div></div><section class="game"><div class="screen"><canvas id="canvas" width="1100" height="620"></canvas><div class="status" id="status">Aをおして ロケットランチャーをもとう！</div></div><div class="buttons"><button id="equip"><kbd>A</kbd>そうび</button><button class="fire" id="fire"><kbd>D</kbd>はっしゃ</button><button id="add"><kbd>T</kbd>ビルついか</button><button class="reset" id="reset">やりなおす</button></div></section><p class="tip">ビルは なんどか あてると こわれるよ。れんぞくヒットで スコアアップ！</p></main>
<script>(()=>{'use strict';const C=document.querySelector('#canvas'),X=C.getContext('2d'),W=1100,H=620,G=535,S=document.querySelector('#status'),scoreEl=document.querySelector('#score'),countEl=document.querySelector('#count');let equipped=false,score=0,combo=0,frame=0,rocket={x:290,y:437,on:false},parts=[],blasts=[];const mk=x=>{let w=110+Math.random()*55,h=180+Math.random()*230,hp=Math.ceil(h/90)+1;return{x,w,h,hp,max:hp,hue:195+Math.random()*55,win:Array(30).fill(true)}};let buildings=[mk(555),mk(750),mk(935)];const msg=t=>S.textContent=t,ui=()=>{scoreEl.textContent=score.toLocaleString();countEl.textContent=`ビル ${buildings.length}こ`};function equip(){equipped=true;msg('そうび かんりょう！ Dではっしゃ！')}function fire(){if(!equipped)return msg('まず Aでロケットランチャーをもとう！');if(rocket.on)return;rocket={x:290,y:437,on:true};msg('ロケット はっしゃ！')}function add(){buildings.push(mk(0));if(buildings.length>5)buildings.shift();buildings.forEach((b,i)=>b.x=500+i*145);ui();msg('あたらしい ビルが たった！')}function reset(){buildings=[mk(555),mk(750),mk(935)];score=combo=0;rocket.on=false;parts=[];blasts=[];ui();msg('Aをおして ロケットランチャーをもとう！')}document.querySelector('#equip').onclick=equip;document.querySelector('#fire').onclick=fire;document.querySelector('#add').onclick=add;document.querySelector('#reset').onclick=reset;addEventListener('keydown',e=>{if(e.repeat)return;let k=e.key.toLowerCase();if(k==='a')equip();if(k==='d')fire();if(k==='t')add()});
function draw(){frame++;let g=X.createLinearGradient(0,0,0,H);g.addColorStop(0,'#071531');g.addColorStop(.58,'#173764');g.addColorStop(1,'#f97316');X.fillStyle=g;X.fillRect(0,0,W,H);X.fillStyle='#ffffffbb';for(let i=0;i<70;i++){let x=i*137%W,y=i*83%300;X.fillRect(x,y,i%6?1:2,i%6?1:2)}X.fillStyle='#f8fafc';X.beginPath();X.arc(900,98,43,0,7);X.fill();X.fillStyle='#111827';X.fillRect(0,G,W,H-G);X.fillStyle='#374151';X.fillRect(0,G,W,8);X.strokeStyle='#fbbf24';X.lineWidth=4;X.setLineDash([38,32]);X.beginPath();X.moveTo(0,585);X.lineTo(W,585);X.stroke();X.setLineDash([]);buildings.forEach(b=>{let y=G-b.h,d=1-b.hp/b.max;X.save();X.translate(b.x+b.w/2,y+b.h/2);X.rotate(Math.sin(frame*.025+b.x)*d*.035);X.translate(-b.w/2,-b.h/2);let bg=X.createLinearGradient(0,0,b.w,b.h);bg.addColorStop(0,`hsl(${b.hue} 70% 45%)`);bg.addColorStop(1,`hsl(${b.hue+30} 65% 20%)`);X.fillStyle=bg;X.fillRect(0,0,b.w,b.h);X.strokeStyle='#ffffff47';X.lineWidth=4;X.strokeRect(2,2,b.w-4,b.h-4);let rows=Math.max(3,Math.floor(b.h/52));for(let r=0;r<rows;r++)for(let c=0;c<3;c++){let n=(r*3+c)%30;X.fillStyle=b.win[n]?((r+c)%3?'#fde68a':'#67e8f9'):'#111827';X.fillRect(15+c*((b.w-30)/3),22+r*46,20,26)}if(d>.15){X.strokeStyle='#111827';X.lineWidth=5;X.beginPath();X.moveTo(b.w*.7,b.h*.15);X.lineTo(b.w*.52,b.h*.34);X.lineTo(b.w*.68,b.h*.5);X.stroke()}X.restore()});X.fillStyle='#22d3ee';X.beginPath();X.arc(230,455,28,0,7);X.fill();X.fillStyle='#f97316';X.fillRect(201,480,58,53);X.fillStyle='#0f172a';X.fillRect(197,528,25,12);X.fillRect(242,528,25,12);X.fillRect(218,448,8,6);X.fillRect(238,448,8,6);if(equipped){X.fillStyle='#64748b';X.fillRect(260,439,68,19);X.fillStyle='#f97316';X.fillRect(275,458,14,26);X.fillStyle='#1e293b';X.beginPath();X.arc(330,448,13,0,7);X.fill()}
if(rocket.on){rocket.x+=14;X.fillStyle='#f8fafc';X.fillRect(rocket.x,rocket.y,32,11);X.fillStyle='#ef4444';X.beginPath();X.moveTo(rocket.x+32,rocket.y);X.lineTo(rocket.x+46,rocket.y+5);X.lineTo(rocket.x+32,rocket.y+11);X.fill();X.fillStyle=frame%2?'#fbbf24':'#fb7185';X.beginPath();X.moveTo(rocket.x,rocket.y+2);X.lineTo(rocket.x-28,rocket.y+5);X.lineTo(rocket.x,rocket.y+9);X.fill();let hit=buildings.find(b=>rocket.x+44>=b.x&&rocket.y>=G-b.h);if(hit||rocket.x>W){rocket.on=false;if(hit){blasts.push({x:rocket.x+35,y:rocket.y+5,r:8,life:28});hit.hp--;hit.win[Math.floor(Math.random()*30)]=false;for(let i=0;i<20;i++)parts.push({x:rocket.x+30,y:rocket.y,vx:(Math.random()-.5)*9,vy:-Math.random()*9,life:45,c:i%3?'#fb923c':'#94a3b8'});score+=100*(++combo);if(hit.hp<=0){score+=1000;buildings=buildings.filter(b=>b!==hit);msg('ビル はかい！ Tでふやせるよ！')}else msg(`ヒット！ あと ${hit.hp} はつ！`);ui()}}}blasts=blasts.filter(b=>b.life-->0);blasts.forEach(b=>{b.r+=4;let a=b.life/28;X.fillStyle=`rgba(251,146,60,${a*.7})`;X.beginPath();X.arc(b.x,b.y,b.r,0,7);X.fill();X.fillStyle=`rgba(254,240,138,${a})`;X.beginPath();X.arc(b.x,b.y,b.r*.45,0,7);X.fill()});parts=parts.filter(p=>p.life-->0);parts.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.vy+=.38;X.fillStyle=p.c;X.fillRect(p.x,p.y,7,7)});if(!buildings.length){X.fillStyle='#071531cc';X.fillRect(340,210,430,130);X.fillStyle='#fef3c7';X.font='900 42px Arial';X.textAlign='center';X.fillText('ぜんぶ はかい！',555,272);X.font='700 22px Arial';X.fillText('Tで ビルを ふやそう',555,310);X.textAlign='start'}requestAnimationFrame(draw)}draw()})();</script></body></html>
