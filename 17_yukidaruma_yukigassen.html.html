<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no"><title>ゆきだるま雪合戦</title><style>
*{box-sizing:border-box}body{margin:0;overflow:hidden;font-family:Arial,"Hiragino Maru Gothic ProN",sans-serif;background:#06305c;color:#fff;user-select:none}canvas{display:block;width:100vw;height:100vh;touch-action:none}.hud{position:fixed;inset:0;pointer-events:none}.title{position:absolute;top:12px;left:50%;transform:translateX(-50%);font-size:clamp(20px,4vw,36px);font-weight:900;text-shadow:0 4px #1477b3;white-space:nowrap}.top{display:flex;justify-content:space-between;padding:15px;font-size:20px}.pill{background:#082958cc;border:2px solid #8de2ff;border-radius:99px;padding:8px 14px}.help{position:absolute;top:70px;left:50%;transform:translateX(-50%);background:#fffde7e8;color:#06345c;border-radius:12px;padding:7px 12px;font-size:clamp(11px,2vw,16px);white-space:nowrap}.controls{position:fixed;bottom:18px;left:0;right:0;display:flex;justify-content:space-between;padding:0 18px}.group{display:flex;gap:10px}.btn{width:65px;height:65px;border:3px solid #fff;background:#168bdbe8;color:#fff;border-radius:18px;font-size:28px;font-weight:bold;box-shadow:0 5px #075488;touch-action:none}.btn:active{transform:translateY(4px);box-shadow:0 1px #075488}.word{width:86px;font-size:16px}.jump{background:#654bc4}.throw{background:#ec514a}.overlay{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#03204cbb}.card{background:linear-gradient(#fff,#d9f6ff);color:#07345d;text-align:center;border:5px solid #70d8ff;border-radius:28px;padding:25px;width:min(440px,88vw);box-shadow:0 18px 50px #001b}.card h1{margin:0 0 10px;font-size:clamp(30px,8vw,50px)}.card p{line-height:1.7}.start{border:0;border-radius:99px;padding:14px 35px;background:#ff5d4f;color:#fff;font-size:22px;font-weight:900;box-shadow:0 6px #b42b2b}.hidden{display:none}
</style></head><body><canvas id="game"></canvas><div class="hud"><div class="title">ゆきだるま雪合戦</div><div class="top"><div class="pill">❤️ <span id="hp">5</span></div><div class="pill">たおした数 <span id="score">0</span>/3</div></div><div class="help">← → / A D：いどう　スペース：ジャンプ　F：雪玉</div></div><div class="controls"><div class="group"><button class="btn" data-k="left">◀</button><button class="btn" data-k="right">▶</button></div><div class="group"><button class="btn word jump" data-k="jump">ジャンプ</button><button class="btn word throw" data-k="throw">雪玉！</button></div></div><div id="overlay" class="overlay"><div class="card"><h1>⛄ 雪合戦！</h1><p>雪玉を投げて、敵の雪だるまを<br><b>3体</b>たおそう！</p><p>5回当たると負けだよ。</p><button id="start" class="start">ゲームスタート</button></div></div><script>
const c=document.querySelector('#game'),g=c.getContext('2d'),ov=document.querySelector('#overlay'),hpE=document.querySelector('#hp'),scE=document.querySelector('#score');let W,H,G,play=false,last=0,score=0,timer=0,shake=0,p,balls,enemies,snow;const key={left:false,right:false};
function size(){c.width=innerWidth*devicePixelRatio;c.height=innerHeight*devicePixelRatio;g.setTransform(devicePixelRatio,0,0,devicePixelRatio,0,0);W=innerWidth;H=innerHeight;G=H-100}addEventListener('resize',size);size();
function reset(){p={x:80,y:G-50,vx:0,vy:0,r:25,hp:5,cool:0,face:1,flash:0};balls=[];enemies=[];snow=Array.from({length:75},()=>({x:Math.random()*W,y:Math.random()*H,s:1+Math.random()*3,v:.5+Math.random()}));score=timer=0;hpE.textContent=5;scE.textContent=0;play=true;last=performance.now();requestAnimationFrame(loop)}
function man(o,bad){g.save();if(o.flash)g.globalAlpha=.4;g.translate(o.x,o.y);g.fillStyle=bad?'#ff7973':'#fff';g.strokeStyle=bad?'#a8202d':'#83d9f1';g.lineWidth=3;g.beginPath();g.arc(0,18,o.r,0,7);g.fill();g.stroke();g.beginPath();g.arc(0,-14,18,0,7);g.fill();g.stroke();g.fillStyle='#132c43';g.beginPath();g.arc(-7,-18,3,0,7);g.arc(7,-18,3,0,7);g.fill();g.fillStyle='#ef892d';g.beginPath();g.moveTo(0,-11);g.lineTo((o.face||-1)*15,-8);g.lineTo(0,-5);g.fill();g.fillStyle=bad?'#611':'#174b82';g.fillRect(-18,0,36,6);g.fillStyle='#222';g.fillRect(-18,-39,36,7);g.fillRect(-12,-54,24,17);g.restore()}
function throwBall(){if(!play||p.cool)return;p.cool=24;balls.push({x:p.x+p.face*28,y:p.y-10,vx:p.face*9,vy:-2,own:true})}function jump(){if(p.y>=G-51)p.vy=-13}function hit(a,b){return Math.hypot(a.x-b.x,a.y-b.y)<32}function end(win){play=false;ov.classList.remove('hidden');ov.querySelector('.card').innerHTML='<h1>'+(win?'🏆 かち！':'🥶 まけ…')+'</h1><p>'+(win?'雪合戦のチャンピオンだ！':'もう一回チャレンジしよう！')+'</p><button class="start" onclick="location.reload()">もう一回</button>'}
addEventListener('keydown',e=>{if(['ArrowLeft','a','A'].includes(e.key))key.left=true;if(['ArrowRight','d','D'].includes(e.key))key.right=true;if(e.code==='Space'){e.preventDefault();jump()}if(e.key.toLowerCase()==='f')throwBall()});addEventListener('keyup',e=>{if(['ArrowLeft','a','A'].includes(e.key))key.left=false;if(['ArrowRight','d','D'].includes(e.key))key.right=false});document.querySelectorAll('[data-k]').forEach(b=>{let k=b.dataset.k;b.onpointerdown=e=>{e.preventDefault();if(k==='left'||k==='right')key[k]=true;if(k==='jump')jump();if(k==='throw')throwBall()};b.onpointerup=b.onpointercancel=()=>{key.left=key.right=false}});document.querySelector('#start').onclick=()=>{ov.classList.add('hidden');reset()};
function update(){snow.forEach(s=>{s.y+=s.v;if(s.y>H){s.y=-5;s.x=Math.random()*W}});p.vx=(+key.right-+key.left)*5;if(p.vx)p.face=Math.sign(p.vx);p.x=Math.max(28,Math.min(W-28,p.x+p.vx));p.vy+=.65;p.y=Math.min(G-50,p.y+p.vy);if(p.y>=G-50)p.vy=0;p.cool=Math.max(0,p.cool-1);p.flash=Math.max(0,p.flash-1);if(++timer>85&&enemies.length<2){timer=0;let r=Math.random()<.5;enemies.push({x:r?W+40:-40,y:G-50,r:24,hp:2,cool:50+Math.random()*60,face:r?-1:1,flash:0})}enemies.forEach(e=>{e.face=p.x<e.x?-1:1;let d=Math.abs(e.x-p.x);if(d>220)e.x+=e.face*(1.1+score*.15);e.cool--;e.flash=Math.max(0,e.flash-1);if(e.cool<0&&d<550){e.cool=Math.max(40,100-score*8)+Math.random()*40;balls.push({x:e.x+e.face*24,y:e.y-10,vx:e.face*(4+score*.3),vy:-2.5,own:false})}});balls.forEach(b=>{b.x+=b.vx;b.y+=b.vy;b.vy+=.09});for(let i=balls.length-1;i>=0;i--){let b=balls[i];if(b.own){let j=enemies.findIndex(e=>hit(b,e));if(j>=0){enemies[j].hp--;enemies[j].flash=8;balls.splice(i,1);shake=7;if(enemies[j].hp<=0){enemies.splice(j,1);scE.textContent=++score;if(score>=3)return end(true)}continue}}else if(!p.flash&&hit(b,p)){balls.splice(i,1);p.flash=30;shake=10;hpE.textContent=--p.hp;if(p.hp<=0)return end(false);continue}if(b.x<-40||b.x>W+40||b.y>H)balls.splice(i,1)}}
function draw(){g.save();if(shake){g.translate((Math.random()-.5)*shake,(Math.random()-.5)*shake);shake--}let q=g.createLinearGradient(0,0,0,H);q.addColorStop(0,'#0c4d87');q.addColorStop(.62,'#69c6eb');q.addColorStop(1,'#effeff');g.fillStyle=q;g.fillRect(0,0,W,H);g.fillStyle='#d8f6ff';for(let i=0;i<8;i++){let z=i*W/7-80;g.beginPath();g.moveTo(z,G);g.lineTo(z+100,G-120-(i%3)*35);g.lineTo(z+210,G);g.fill()}g.fillStyle='#f8feff';g.fillRect(0,G,W,H-G);g.fillStyle='#c7ecf7';g.fillRect(0,G,W,8);snow.forEach(s=>{g.fillStyle='#fff';g.beginPath();g.arc(s.x,s.y,s.s,0,7);g.fill()});balls.forEach(b=>{g.fillStyle='#fff';g.strokeStyle=b.own?'#39aee2':'#f45';g.lineWidth=2;g.beginPath();g.arc(b.x,b.y,8,0,7);g.fill();g.stroke()});man(p,false);enemies.forEach(e=>man(e,true));g.restore()}function loop(t){if(!play)return;last=t;update();draw();requestAnimationFrame(loop)}draw();
</script></body></html>
