<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no"><title>鬼からの脱出・むずかしい</title>
<style>*{box-sizing:border-box}body{margin:0;background:#130f19;color:#fff;font-family:Arial,sans-serif;display:grid;place-items:center;min-height:100vh;overflow:hidden}.wrap{width:min(920px,100%);padding:8px}.top{display:flex;justify-content:space-between;align-items:center;gap:8px}.top h1{font-size:clamp(20px,4vw,35px);margin:0 0 7px;color:#ffe767;text-shadow:3px 3px #711}.tasks{display:flex;gap:5px;flex-wrap:wrap;justify-content:flex-end}.task{padding:6px 9px;border:2px solid #766a84;border-radius:9px;background:#292231;font-weight:bold;font-size:12px}.done{background:#185b3c;border-color:#52e895}.danger{background:#742b35}.game{position:relative;border:4px solid #665a70;border-radius:16px;overflow:hidden}canvas{display:block;width:100%;height:auto;max-height:69vh;background:#27202d;touch-action:none}.message{position:absolute;inset:0;background:#0b0715ce;display:grid;place-items:center;text-align:center;padding:15px}.card{background:#282033;border:4px solid #9b88aa;border-radius:20px;padding:18px 27px;box-shadow:0 8px #09060c}.card h2{font-size:29px;margin:4px}.card p{line-height:1.65}.card button{border:0;border-radius:12px;padding:11px 22px;background:#ffe04e;color:#21152b;font-weight:900;font-size:18px;box-shadow:0 5px #8b7215}.help{display:flex;align-items:center;justify-content:space-between;margin-top:6px;color:#cfc4d8;font-size:12px}.pad{text-align:center}.pad button{width:44px;height:37px;margin:2px;border:2px solid #927fa5;border-radius:9px;background:#31263d;color:#fff;font-size:17px;touch-action:none}.pad>button{display:block;margin:auto}.hidden{display:none}@media(max-width:600px){.top{align-items:flex-start}.top h1{font-size:19px}.task{font-size:9px;padding:4px}.help>span{font-size:9px}.card{padding:13px}.card h2{font-size:23px}}</style></head>
<body><main class="wrap"><div class="top"><h1>👹 鬼からの脱出・むずかしい</h1><div class="tasks"><span id="time" class="task">⏱️55</span><span id="coins" class="task">🪙0/7</span><span id="key" class="task">🔑カギ</span><span id="sw" class="task">🔘スイッチ</span></div></div><div class="game"><canvas id="c" width="900" height="560"></canvas><div id="msg" class="message"><div class="card"><div style="font-size:62px">🏃💨👹👹</div><h2>むずかしいモード！</h2><p>55びょう以内にコイン7まい・カギ・スイッチを集めよう。<br>鬼は2体！動くトゲにも気をつけて！</p><button id="start">スタート</button></div></div></div><div class="help"><span>矢印キー / WASDで移動</span><div class="pad"><button data-k="ArrowUp">▲</button><section><button data-k="ArrowLeft">◀</button><button data-k="ArrowDown">▼</button><button data-k="ArrowRight">▶</button></section></div></div></main>
<script>const C=document.querySelector('#c'),g=C.getContext('2d'),msg=document.querySelector('#msg'),keys={};let run=false,p,onis,items,got,time,stamp,spike,parts=[];const walls=[{x:210,y:100,w:35,h:290},{x:430,y:0,w:35,h:220},{x:430,y:340,w:35,h:220},{x:650,y:110,w:35,h:300},{x:80,y:435,w:230,h:28},{x:590,y:55,w:210,h:28}];
function reset(){p={x:55,y:500,r:16};onis=[{x:820,y:500,r:21,s:2.05},{x:820,y:115,r:21,s:1.88}];spike={x:290,y:280,dx:2.8,r:18};items=[['coin',95,85],['coin',330,180],['coin',350,500],['coin',560,90],['coin',790,185],['coin',535,285],['coin',110,360],['key',545,470],['sw',790,470]].map(a=>({t:a[0],x:a[1],y:a[2]}));got={coins:0,key:false,sw:false};parts=[];time=55;stamp=performance.now();run=true;msg.classList.add('hidden');hud()}
function hud(){let a=document.querySelector('#coins'),b=document.querySelector('#key'),c=document.querySelector('#sw'),t=document.querySelector('#time');a.textContent='🪙'+got.coins+'/7';b.textContent=(got.key?'✅':'🔑')+'カギ';c.textContent=(got.sw?'✅':'🔘')+'スイッチ';t.textContent='⏱️'+time;a.classList.toggle('done',got.coins===7);b.classList.toggle('done',got.key);c.classList.toggle('done',got.sw);t.classList.toggle('danger',time<=10)}
function wall(nx,ny,r){return nx-r<0||nx+r>C.width||ny-r<0||ny+r>C.height||walls.some(w=>nx+r>w.x&&nx-r<w.x+w.w&&ny+r>w.y&&ny-r<w.y+w.h)}function move(o,dx,dy){if(!wall(o.x+dx,o.y,o.r))o.x+=dx;if(!wall(o.x,o.y+dy,o.r))o.y+=dy}function end(title,text,face){run=false;msg.innerHTML='<div class="card"><div style="font-size:62px">'+face+'</div><h2>'+title+'</h2><p>'+text+'</p><button id="again">もういちど</button></div>';msg.classList.remove('hidden');document.querySelector('#again').onclick=reset}
function update(){if(!run)return;let now=performance.now();if(now-stamp>=1000){time--;stamp+=1000;hud();if(time<=0)return end('時間切れ！','もっと急いで集めよう。','⏱️')}let dx=(keys.ArrowRight||keys.d?1:0)-(keys.ArrowLeft||keys.a?1:0),dy=(keys.ArrowDown||keys.s?1:0)-(keys.ArrowUp||keys.w?1:0),l=Math.hypot(dx,dy)||1;move(p,dx/l*3.55,dy/l*3.55);onis.forEach(o=>{let dx=p.x-o.x,dy=p.y-o.y,l=Math.hypot(dx,dy)||1;move(o,dx/l*o.s,dy/l*o.s)});spike.x+=spike.dx;if(spike.x<275||spike.x>605)spike.dx*=-1;items=items.filter(q=>{if(Math.hypot(p.x-q.x,p.y-q.y)<30){q.t==='coin'?got.coins++:got[q.t]=true;for(let i=0;i<9;i++)parts.push({x:q.x,y:q.y,dx:Math.random()*4-2,dy:Math.random()*4-2,a:1});hud();return false}return true});parts.forEach(q=>{q.x+=q.dx;q.y+=q.dy;q.a-=.04});parts=parts.filter(q=>q.a>0);if(onis.some(o=>Math.hypot(p.x-o.x,p.y-o.y)<38))return end('つかまった！','2体の鬼をよく見て逃げよう。','👹');if(Math.hypot(p.x-spike.x,p.y-spike.y)<34)return end('トゲにぶつかった！','動くタイミングを見て通ろう。','💥');if(got.coins===7&&got.key&&got.sw&&p.x>830&&p.y<70)end('脱出成功！','むずかしい条件を全部クリアしたよ！','🎉')}
function draw(){g.fillStyle='#2c2532';g.fillRect(0,0,900,560);g.fillStyle='#45394d';for(let i=0;i<55;i++)g.fillRect((i*83)%900,(i*137)%560,3,3);g.fillStyle='#17121d';walls.forEach(w=>{g.fillRect(w.x,w.y,w.w,w.h);g.strokeStyle='#65566f';g.strokeRect(w.x,w.y,w.w,w.h)});let open=got&&got.coins===7&&got.key&&got.sw;g.fillStyle=open?'#36e578':'#8c3540';g.fillRect(840,0,60,60);g.font='30px sans-serif';g.fillText(open?'🚪':'🔒',854,40);if(items)items.forEach(q=>{g.font='27px sans-serif';g.fillText(q.t==='coin'?'🪙':q.t==='key'?'🔑':'🔘',q.x-14,q.y+12)});parts.forEach(q=>{g.globalAlpha=q.a;g.fillStyle='#ffe35b';g.fillRect(q.x,q.y,5,5)});g.globalAlpha=1;if(p){g.font='34px sans-serif';g.fillText('🏃',p.x-18,p.y+14);g.font='42px sans-serif';onis.forEach(o=>g.fillText('👹',o.x-22,o.y+17));g.font='35px sans-serif';g.fillText('⚙️',spike.x-18,spike.y+14)}requestAnimationFrame(()=>{update();draw()})}draw();
document.querySelector('#start').onclick=reset;addEventListener('keydown',e=>{if(e.key.startsWith('Arrow'))e.preventDefault();keys[e.key]=keys[e.key.toLowerCase()]=true});addEventListener('keyup',e=>keys[e.key]=keys[e.key.toLowerCase()]=false);document.querySelectorAll('[data-k]').forEach(b=>{let k=b.dataset.k;['pointerdown','touchstart'].forEach(n=>b.addEventListener(n,e=>{e.preventDefault();keys[k]=true}));['pointerup','pointercancel','pointerleave','touchend'].forEach(n=>b.addEventListener(n,e=>{e.preventDefault();keys[k]=false}))});</script></body></html>
